<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Login - HUST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; }
        /* HEADER & FOOTER CHUẨN HUST */
        .hust-header { background-color: #b71c1c; color: white; padding: 15px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hust-logo { height: 50px; margin-right: 15px; background: white; padding: 5px; border-radius: 50%; }
        .hust-footer { background-color: #b71c1c; color: white; text-align: center; padding: 15px 0; margin-top: auto; position: fixed; bottom: 0; width: 100%; }
        
        /* LOGIN CARD */
        .login-card { border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 60px; }
        .card-header-hust { background-color: #b71c1c; color: white; text-align: center; padding: 20px; font-weight: bold; font-size: 1.2rem; border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .btn-hust { background-color: #b71c1c; color: white; width: 100%; padding: 10px; font-weight: bold; }
        .btn-hust:hover { background-color: #8e1515; color: white; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="hust-header">
        <div class="container d-flex align-items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Logo_Hust.png" class="hust-logo">
            <h1 class="m-0 fw-bold fs-4 text-uppercase">Hanoi University of Science and Technology</h1>
        </div>
    </div>

    <div class="container d-flex justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="card-header-hust">TEACHER LOGIN</div>
                <div class="card-body p-4">
                    
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-danger text-center">{{ messages[0] }}</div>
                        {% endif %}
                    {% endwith %}

                    <form action="/teacher_login" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password / Access Code</label>
                            <input type="password" class="form-control form-control-lg" name="password" placeholder="Enter teacher password..." required>
                        </div>
                        <button type="submit" class="btn btn-hust mt-3">LOGIN SYSTEM</button>
                        <div class="text-center mt-3">
                            <a href="/" class="text-secondary text-decoration-none">Back to Home</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="hust-footer">
        <p class="m-0 small">&copy; 2026 HUST - Face Attendance System</p>
    </footer>

</body>
</html>
