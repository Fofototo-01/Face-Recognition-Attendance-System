<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Class - HUST Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; }
        .hust-header { background-color: #b71c1c; color: white; padding: 15px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hust-logo { height: 50px; margin-right: 15px; background: white; padding: 5px; border-radius: 50%; }
        .header-title { font-weight: 700; font-size: 1.2rem; text-transform: uppercase; margin: 0; }
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; margin-top: 50px; }
        .card-header-custom { background-color: #b71c1c; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.5rem; }
        .btn-hust { background-color: #b71c1c; color: white; font-weight: bold; padding: 10px 30px; transition: all 0.3s; }
        .btn-hust:hover { background-color: #8e1515; color: white; transform: translateY(-2px); }
        .hust-footer { background-color: #b71c1c; color: white; text-align: center; padding: 15px 0; margin-top: auto; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="hust-header">
        <div class="container d-flex align-items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Logo_Hust.png" alt="HUST Logo" class="hust-logo">
            <div>
                <h1 class="header-title">Hanoi University of Science and Technology</h1>
                <p style="font-size: 0.8rem; margin: 0; opacity: 0.9;">Face Recognition System</p>
            </div>
        </div>
    </div>

    <div class="container d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom">
                <div class="card-header-custom">
                    CONFIRM ATTENDANCE
                </div>
                <div class="card-body p-4 text-center">
                    <h5 class="mb-3 text-muted">Face Recognized Successfully!</h5>
                    <p class="mb-4">Please select the class you are attending to finalize the process.</p>
                    
                    <form action="/select_class" method="post">
                        <div class="mb-4">
                            <select class="form-select form-select-lg" name="classes" required>
                                <option selected disabled>-- Select a Class --</option>
                                <option value="Calculus_1">Calculus 1</option>
                                <option value="Algebra">Algebra</option>
                                <option value="K70_ET_E16_01">K70 - ET_E16-01</option>
                                <option value="K70_ET_E16_02">K70 - ET_E16-02</option>
                            </select>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-hust">
                                Confirm & Submit
                            </button>
                            <a href="/" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="hust-footer">
        <div class="container">
            <p style="font-size: 0.8em; margin: 0;">&copy; 2026 HUST - Face Attendance System</p>
        </div>
    </footer>

</body>
</html>
