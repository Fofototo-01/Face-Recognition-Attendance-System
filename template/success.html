<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success - HUST Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; }
        .hust-header { background-color: #b71c1c; color: white; padding: 15px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hust-logo { height: 50px; margin-right: 15px; background: white; padding: 5px; border-radius: 50%; }
        .hust-footer { background-color: #b71c1c; color: white; text-align: center; padding: 15px 0; margin-top: auto; position: fixed; bottom: 0; width: 100%; }
        
        .result-card { border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 50px; overflow: hidden; }
        .card-header-success { background-color: #28a745; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.5rem; }
        .captured-img { width: 100%; max-width: 300px; border: 5px solid #eee; border-radius: 10px; margin: 20px 0; }
        .btn-hust { background-color: #b71c1c; color: white; font-weight: bold; padding: 10px 30px; }
        .btn-hust:hover { background-color: #8e1515; color: white; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="hust-header">
        <div class="container d-flex align-items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Logo_Hust.png" class="hust-logo">
            <h1 class="m-0 fw-bold fs-4 text-uppercase">Hanoi University of Science and Technology</h1>
        </div>
    </div>

    <div class="container d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card result-card">
                <div class="card-header-success">
                    <i class="bi bi-check-circle-fill"></i> REGISTRATION SUCCESSFUL
                </div>
                <div class="card-body p-4 text-center">
                    <h4 class="fw-bold mb-3">Student Data Saved!</h4>
                    <p class="text-muted">The new face and information have been added to the database.</p>

                    <img src="{{ image_url }}" class="captured-img" alt="Student Image">
                    
                    <div class="d-grid gap-2 mt-3">
                        <a href="/" class="btn btn-hust">
                            Back to Home
                        </a>
                        <a href="/add_info" class="btn btn-outline-secondary">
                            Add Another Student
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="hust-footer">
        <p class="m-0 small">&copy; 2026 HUST - Face Attendance System</p>
    </footer>

</body>
</html>
